# Opens/updates the release PR and, once it merges, tags and publishes the release, via the
# shared compliance-framework/workflows release-please.yml (tracking @main until v1 is tagged).
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please

jobs:
  release-please:
    uses: compliance-framework/workflows/.github/workflows/release-please.yml@0820491954d2f748fed5601109a8b6e422deee69 # v1.1.0
    permissions:
      contents: read
    secrets: inherit
