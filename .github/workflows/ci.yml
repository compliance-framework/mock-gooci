# Trial adoption of the shared go-lib CI, tracking compliance-framework/workflows@main
# until v1 is tagged. The status check to require is `ci / required`.
name: ci

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions: {}

jobs:
  ci:
    uses: compliance-framework/workflows/.github/workflows/ci-go-lib.yml@main
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write
    secrets: inherit

  notify:
    needs: [ci]
    if: failure()
    uses: compliance-framework/workflows/.github/workflows/notify-failure.yml@main
    with:
      workflows-ref: main
    permissions:
      actions: read
      contents: read
    secrets: inherit
