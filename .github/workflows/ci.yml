# Trial adoption of the shared go-lib CI, tracking compliance-framework/workflows@ra/w1-s1-t05b-repo-settings-workflow
# (top of the workflows PR stack) until the stack merges. The status check to require is `ci / required`.
name: ci

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions: {}

jobs:
  ci:
    uses: compliance-framework/workflows/.github/workflows/ci-go-lib.yml@ra/w1-s1-t05b-repo-settings-workflow
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write
    secrets: inherit

  notify:
    needs: [ci]
    if: failure()
    uses: compliance-framework/workflows/.github/workflows/notify-failure.yml@ra/w1-s1-t05b-repo-settings-workflow
    with:
      workflows-ref: ra/w1-s1-t05b-repo-settings-workflow
    permissions:
      actions: read
      contents: read
    secrets: inherit
