# Publishes a release (kind go-lib): goreleaser attaches the archives to the GitHub release
# release-please (or cut-prerelease) created, via the shared compliance-framework/workflows
# release-go-lib.yml (tracking @main until v1 is tagged).
name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release:
    uses: compliance-framework/workflows/.github/workflows/release-go-lib.yml@5a81b1ac6081babf702713afb497d5a4f5c662bf # v1.0.0
    permissions:
      contents: write
      packages: write
    secrets: inherit
