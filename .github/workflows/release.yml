# Publishes a release (kind go-lib): goreleaser attaches the archives to the GitHub release
# release-please (or cut-prerelease) created, via the shared compliance-framework/workflows
# release-go-lib.yml (tracking @main until v1 is tagged).
name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release:
    uses: compliance-framework/workflows/.github/workflows/release-go-lib.yml@55c549bf712163152173b398e297fba0f907ceca # v1.4.0
    permissions:
      contents: write
      packages: write
    secrets: inherit
