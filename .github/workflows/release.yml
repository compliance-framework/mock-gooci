# Publishes a release (kind go-lib): goreleaser attaches the archives to the GitHub release
# release-please (or cut-prerelease) created, via the shared compliance-framework/workflows
# release-go-lib.yml (tracking @main until v1 is tagged).
name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release:
    uses: compliance-framework/workflows/.github/workflows/release-go-lib.yml@0820491954d2f748fed5601109a8b6e422deee69 # v1.1.0
    permissions:
      contents: write
      packages: write
    secrets: inherit
